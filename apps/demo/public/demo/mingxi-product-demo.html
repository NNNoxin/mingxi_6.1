<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>明晰 · 产品 Demo（手机 + 网页）离线完整包</title>
<style>
  :root {
    --ink: #1c1a17;
    --muted: #6f675c;
    --line: rgba(40, 32, 24, 0.12);
    --paper: #fffcf8;
    --rose: #e8cfc4;
    --rose-deep: #c98974;
    --green: #0a8f6c;
    --xhs: #ff2442;
    --bg: #e8eee9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse 70% 40% at 15% 0%, rgba(10, 143, 108, 0.14), transparent),
      radial-gradient(ellipse 50% 35% at 90% 10%, rgba(201, 137, 116, 0.16), transparent),
      linear-gradient(165deg, #dfe8e2, #f4f7f5 50%, #d5ddd7);
  }
  .top {
    position: sticky; top: 0; z-index: 40;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 20px;
    background: rgba(255, 252, 248, 0.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand b { font-family: "Songti SC", "STSong", "PingFang SC", Georgia, serif; font-size: 1.25rem; font-weight: 600; }
  .brand span { font-size: 12px; color: var(--muted); }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .tabs button {
    border: 0; background: transparent; padding: 0.45rem 1rem; font: inherit; font-size: 0.85rem; cursor: pointer; color: var(--muted);
  }
  .tabs button.on { background: var(--ink); color: #fff; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions button, .actions a {
    border: 1px solid var(--line); background: #fff; border-radius: 10px;
    padding: 0.4rem 0.75rem; font: inherit; font-size: 0.8rem; cursor: pointer; color: var(--ink); text-decoration: none;
  }
  .actions .primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .actions .tour {
    background: linear-gradient(135deg, #0a8f6c, #1a5f4a);
    color: #fff; border-color: transparent;
    box-shadow: 0 6px 18px rgba(10, 143, 108, 0.28);
  }
  .actions .tour[disabled] { opacity: 0.55; cursor: wait; }

  /* —— Guided tour —— */
  .tour-dim {
    position: fixed; inset: 0; z-index: 90; pointer-events: none;
    background: rgba(12, 14, 12, 0.45);
    opacity: 0; transition: opacity .25s;
  }
  .tour-dim.on { opacity: 1; pointer-events: auto; }
  .tour-spot {
    position: fixed; z-index: 91; pointer-events: none;
    border-radius: 14px;
    box-shadow: 0 0 0 9999px rgba(12, 14, 12, 0.52), 0 0 0 3px #fff, 0 12px 40px rgba(0,0,0,.25);
    transition: top .35s cubic-bezier(.22,1,.36,1), left .35s cubic-bezier(.22,1,.36,1),
      width .35s cubic-bezier(.22,1,.36,1), height .35s cubic-bezier(.22,1,.36,1);
    display: none;
  }
  .tour-spot.on { display: block; }
  .tour-card {
    position: fixed; z-index: 92; width: min(360px, calc(100vw - 28px));
    background: #fffcf8; border: 1px solid rgba(255,255,255,.5);
    border-radius: 18px; padding: 16px 16px 14px;
    box-shadow: 0 22px 60px rgba(0,0,0,.28);
    display: none; max-height: min(70vh, 520px); overflow: auto;
  }
  .tour-card.on { display: block; animation: tour-in .28s ease; }
  @keyframes tour-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  .tour-card .kicker {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    margin-bottom: 8px; font-size: 11px; color: var(--muted);
  }
  .tour-card .kicker b {
    font-weight: 600; color: var(--green);
    letter-spacing: 0.04em; text-transform: uppercase; font-size: 10.5px;
  }
  .tour-card h3 {
    margin: 0 0 8px; font-family: "Songti SC", "STSong", "PingFang SC", Georgia, serif;
    font-size: 1.15rem; font-weight: 600; line-height: 1.35;
  }
  .tour-card .pain {
    margin: 0 0 8px; padding: 8px 10px; border-radius: 10px;
    background: rgba(201, 137, 116, 0.14); color: #6a4030;
    font-size: 0.78rem; line-height: 1.45;
  }
  .tour-card .pain strong { color: #4a2c20; }
  .tour-card .say {
    margin: 0 0 12px; font-size: 0.86rem; line-height: 1.6; color: #2c2824;
  }
  .tour-card .bar {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between;
  }
  .tour-card .bar .prog {
    flex: 1; min-width: 80px; height: 4px; background: rgba(40,32,24,.08); border-radius: 99px; overflow: hidden;
  }
  .tour-card .bar .prog i {
    display: block; height: 100%; background: var(--green); border-radius: 99px; width: 0%;
    transition: width .3s ease;
  }
  .tour-card .btns { display: flex; gap: 6px; }
  .tour-card .btns button {
    border: 1px solid var(--line); background: #fff; border-radius: 9px;
    padding: 0.35rem 0.7rem; font: inherit; font-size: 0.78rem; cursor: pointer;
  }
  .tour-card .btns .go { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tour-pulse {
    animation: tour-pulse 1.1s ease infinite;
  }
  @keyframes tour-pulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.12); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tour-spot, .tour-card, .tour-dim, .tour-pulse { transition: none !important; animation: none !important; }
  }

  .hint {
    max-width: 1100px; margin: 12px auto 0; padding: 0 20px;
    font-size: 0.8rem; color: var(--muted); line-height: 1.5;
  }
  .stage { max-width: 1200px; margin: 0 auto; padding: 18px 20px 48px; }
  .panel { display: none; }
  .panel.on { display: block; }

  /* —— Phone —— */
  .phone-wrap { display: grid; justify-items: center; gap: 14px; }
  .phone-lead { text-align: center; max-width: 28rem; color: var(--muted); font-size: 0.9rem; line-height: 1.55; margin: 0; }
  .shell {
    width: min(360px, 92vw);
    filter: drop-shadow(0 28px 48px rgba(8, 20, 14, 0.32));
  }
  .bezel {
    position: relative;
    border-radius: 44px;
    background: linear-gradient(145deg, #2a2f2c, #0a0c0b);
    padding: 10px;
    border: 1px solid rgba(255,255,255,.08);
  }
  .punch {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    width: 12px; height: 12px; border-radius: 50%;
    background: #0a0c10; box-shadow: 0 0 0 3px #0c0e0d; z-index: 5;
  }
  .screen {
    position: relative;
    border-radius: 34px;
    overflow: hidden;
    height: 720px;
    background: #0f1412;
    color: #fff;
  }
  .status {
    display: flex; justify-content: space-between; padding: 14px 18px 6px;
    font-size: 12px; font-weight: 600; opacity: .9;
  }
  .home {
    height: calc(100% - 36px);
    padding: 8px 16px 20px;
    background: linear-gradient(180deg, #1a3d36, #0f1f1c 40%, #0a1210);
  }
  .home h3 { margin: 8px 0 14px; font-size: 1.35rem; font-family: "Songti SC", "STSong", Georgia, serif; }
  .apps {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 10px;
  }
  .app {
    border: 0; background: transparent; color: #fff; cursor: pointer; padding: 0;
    display: flex; flex-direction: column; align-items: center; gap: 6px; font: inherit;
  }
  .app i {
    width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center;
    font-style: normal; font-weight: 700; font-size: 13px;
  }
  .app span { font-size: 11px; opacity: .9; }
  .app.xhs i { background: var(--xhs); }
  .app.wx i { background: #07c160; }
  .app.bili i { background: #fb7299; }
  .app.mute i { background: #3a4540; color: #9aa; }

  .xhs-screen {
    height: calc(100% - 36px);
    background: #fff; color: #111; display: flex; flex-direction: column;
  }
  .xhs-nav {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-bottom: 1px solid #eee; font-weight: 600;
  }
  .xhs-nav button { border: 0; background: transparent; font: inherit; cursor: pointer; }
  .xhs-body { flex: 1; overflow: auto; padding: 14px; }
  .xhs-cover {
    height: 180px; border-radius: 12px;
    background: linear-gradient(135deg, #2c1810, #8b4518 40%, #d4a574);
    display: grid; place-items: end start; padding: 14px; color: #fff; font-weight: 600;
  }
  .xhs-title { margin: 12px 0 6px; font-size: 1.05rem; line-height: 1.4; }
  .xhs-meta { font-size: 12px; color: #888; margin-bottom: 12px; }
  .xhs-para { font-size: 14px; line-height: 1.7; color: #333; margin: 0 0 10px; }
  .sel {
    background: rgba(255, 36, 66, 0.12); outline: 2px solid rgba(255,36,66,.35); border-radius: 4px; cursor: text;
  }

  .fb {
    position: absolute; right: 10px; top: 42%; z-index: 12;
    width: 48px; height: 48px; border-radius: 50%;
    border: 0; cursor: pointer;
    background: linear-gradient(145deg, #1de9b6, var(--green));
    box-shadow: 0 8px 20px rgba(10,143,108,.4);
    color: #fff; font-weight: 700; font-size: 18px;
  }
  .fb.hold { transform: scale(1.08); filter: brightness(1.05); }
  .fan {
    position: absolute; right: 62px; top: 28%; width: 200px; z-index: 13;
    background: rgba(20,24,22,.92); backdrop-filter: blur(10px);
    border-radius: 16px; padding: 8px; display: none; flex-direction: column; gap: 4px;
    border: 1px solid rgba(255,255,255,.1);
  }
  .fan.open { display: flex; }
  .fan button {
    border: 0; background: transparent; color: #fff; text-align: left;
    padding: 8px 10px; border-radius: 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .fan button:hover { background: rgba(255,255,255,.1); }
  .fan button.muted { color: #9ab; }
  .flash {
    pointer-events: none; position: absolute; inset: 0; background: #fff;
    opacity: 0; transition: opacity .12s; z-index: 20;
  }
  .flash.on { opacity: .75; }
  .toast {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: rgba(0,0,0,.78); color: #fff; padding: 8px 14px; border-radius: 999px;
    font-size: 12px; opacity: 0; transition: opacity .2s; z-index: 21; white-space: nowrap;
  }
  .toast.on { opacity: 1; }

  .lib-screen {
    height: calc(100% - 36px); background: #f6f7f6; color: #111;
    display: flex; flex-direction: column;
  }
  .lib-screen header {
    padding: 12px 14px; background: #fff; border-bottom: 1px solid #e8ebe9;
    display: flex; justify-content: space-between; align-items: center;
  }
  .lib-list { flex: 1; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .lib-card {
    background: #fff; border-radius: 12px; padding: 10px 12px; border: 1px solid #e8ebe9;
  }
  .lib-card strong { display: block; font-size: 13px; margin-bottom: 4px; }
  .lib-card em { font-style: normal; font-size: 11px; color: #778; }
  .lib-card .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .lib-card .tags i {
    font-style: normal; font-size: 10px; padding: 2px 6px; border-radius: 999px;
    background: #eef3f0; color: #356;
  }
  .pending-bar {
    margin: 8px 10px; padding: 10px; background: #fff8e8; border: 1px dashed #e0b85a; border-radius: 12px;
  }
  .pending-bar strong { display: block; font-size: 12px; margin-bottom: 6px; }
  .pending-bar .picks { display: flex; flex-wrap: wrap; gap: 5px; }
  .pending-bar button {
    border: 1px solid #ddd; background: #fff; border-radius: 8px; padding: 4px 8px; font-size: 11px; cursor: pointer;
  }
  .pending-bar button.on { background: var(--ink); color: #fff; }

  .dock {
    display: flex; gap: 8px; justify-content: center; margin-top: 4px;
  }
  .dock button {
    border: 1px solid var(--line); background: #fff; border-radius: 10px;
    padding: 0.4rem 0.8rem; font: inherit; font-size: 0.8rem; cursor: pointer;
  }

  /* —— Web —— */
  .web {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    min-height: 720px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(40,32,24,.08);
  }
  .web-top {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: #fffdf9;
  }
  .web-nav { display: flex; gap: 6px; }
  .web-nav button {
    border: 0; background: transparent; padding: 0.4rem 0.75rem; border-radius: 999px;
    font: inherit; font-size: 0.82rem; cursor: pointer; color: var(--muted);
  }
  .web-nav button.on { background: var(--ink); color: #fff; }
  .web-body { display: none; padding: 16px; }
  .web-body.on { display: block; }
  .ask {
    display: flex; gap: 10px; align-items: center;
    background: linear-gradient(180deg, #f0ddd3, var(--rose));
    border-radius: 18px; padding: 10px 12px 10px 16px; margin-bottom: 14px;
  }
  .ask span {
    font-size: 12px; font-weight: 600; background: rgba(255,255,255,.55);
    padding: 6px 10px; border-radius: 999px; white-space: nowrap;
  }
  .ask input {
    flex: 1; border: 0; border-radius: 12px; padding: 12px 14px; font: inherit; outline: none;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chips button {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 0.28rem 0.7rem; font: inherit; font-size: 0.75rem; cursor: pointer;
  }
  .chips button.on { background: var(--ink); color: #fff; }
  .lib-layout {
    display: grid; grid-template-columns: 260px 1fr; gap: 14px; align-items: start;
  }
  @media (max-width: 860px) { .lib-layout { grid-template-columns: 1fr; } }
  .rail {
    border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: #fffdf9;
  }
  .rail h4 { margin: 0 0 4px; font-size: 0.85rem; }
  .rail p { margin: 0 0 8px; font-size: 0.72rem; color: var(--muted); }
  .viz-tog { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
  .viz-tog button { border: 0; background: transparent; padding: 0.25rem 0.65rem; font-size: 0.7rem; cursor: pointer; color: var(--muted); }
  .viz-tog button.on { background: var(--ink); color: #fff; }
  .heat-g { margin-bottom: 8px; }
  .heat-g > span { font-size: 0.72rem; font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 4px; }
  .heat-cells { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .heat-cells button {
    border: 1px dashed var(--line); background: rgba(255,255,255,.5); border-radius: 7px;
    min-height: 36px; padding: 4px 6px; font-size: 0.62rem; text-align: left; cursor: pointer; position: relative;
  }
  .heat-cells button.filled {
    border-style: solid;
    background: color-mix(in srgb, var(--ink) calc(var(--h, .3) * 70%), #fffdf8);
  }
  .heat-cells button em { position: absolute; right: 4px; bottom: 2px; font-style: normal; font-size: 0.58rem; }
  .icicle { position: relative; height: 280px; border-radius: 10px; background: #f3efe8; overflow: hidden; }
  .icicle div {
    position: absolute; box-sizing: border-box; border: 1px solid rgba(255,252,246,.55);
    padding: 3px 5px; font-size: 0.62rem; overflow: hidden; cursor: pointer; color: #fff;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .card {
    border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: #fff;
    cursor: pointer; text-align: left; font: inherit;
  }
  .card:hover { border-color: var(--rose-deep); }
  .card strong { display: block; font-size: 0.88rem; margin-bottom: 6px; line-height: 1.35; }
  .card p { margin: 0; font-size: 0.75rem; color: var(--muted); line-height: 1.45; }
  .card .cat { font-size: 0.68rem; color: var(--rose-deep); margin-bottom: 4px; }

  .detail {
    display: none; border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: #fff; margin-top: 12px;
  }
  .detail.on { display: block; }
  .detail .crumb { font-size: 0.72rem; color: var(--muted); margin-bottom: 6px; }
  .detail h2 { margin: 0 0 8px; font-family: "Songti SC", "STSong", Georgia, serif; font-size: 1.25rem; font-weight: 600; }
  .detail .src { font-size: 0.75rem; color: var(--muted); margin-bottom: 10px; }
  .detail .callout {
    background: #f7f4ef; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    font-size: 0.8rem; color: var(--muted); margin-bottom: 12px;
  }
  .detail .callout b { display: block; color: var(--ink); margin-bottom: 4px; font-size: 0.72rem; }
  .detail .body { font-size: 0.88rem; line-height: 1.7; }
  .detail .body h3 { font-size: 0.95rem; margin: 14px 0 6px; }
  .detail .body mark {
    background: linear-gradient(180deg, #ffe678, #ffd650); padding: 0 .1em; border-radius: 3px;
  }
  .detail .tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 12px; }
  .detail .tags em {
    font-style: normal; font-size: 0.7rem; padding: 0.15rem 0.45rem; border-radius: 999px; background: rgba(40,32,24,.06);
  }

  .think {
    display: grid; grid-template-columns: 1fr 1.1fr; gap: 12px; min-height: 560px;
  }
  @media (max-width: 860px) { .think { grid-template-columns: 1fr; } }
  .chat {
    border: 1px solid var(--line); border-radius: 14px; background: #fff; display: flex; flex-direction: column; overflow: hidden;
  }
  .chat-log { flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; max-height: 480px; }
  .bubble { max-width: 95%; padding: 10px 12px; border-radius: 12px; font-size: 0.84rem; line-height: 1.55; }
  .bubble.user { align-self: flex-end; background: #ebe4da; }
  .bubble.ai { align-self: flex-start; background: #f4f7f5; border: 1px solid var(--line); }
  .cite {
    display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line);
    background: #fff; border-radius: 999px; padding: 0.1rem 0.45rem; font-size: 0.72rem; cursor: pointer; margin: 0 2px;
  }
  .cite:hover, .cite.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .canvas {
    border: 1px solid var(--line); border-radius: 14px; background:
      radial-gradient(circle at 20% 20%, rgba(201,137,116,.12), transparent 40%),
      #faf7f2;
    position: relative; min-height: 480px; overflow: hidden;
  }
  .node {
    position: absolute; border: 1px solid var(--line); background: #fff; border-radius: 12px;
    padding: 8px 10px; font-size: 0.72rem; min-width: 100px; box-shadow: 0 6px 16px rgba(40,32,24,.06);
    cursor: pointer;
  }
  .node.q { background: var(--ink); color: #fff; border-color: var(--ink); }
  .node.note { border-color: rgba(201,137,116,.5); }
  .node b { display: block; font-size: 0.78rem; }
  .node em { font-style: normal; color: var(--muted); font-size: 0.65rem; }
  .node.q em { color: rgba(255,255,255,.7); }
  .foot {
    margin-top: 18px; text-align: center; font-size: 0.72rem; color: var(--muted);
  }
</style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <b>明晰 · 产品 Demo</b>
      <span>手机捕获 + 网页工作台 · 单文件离线包</span>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" class="on" data-mode="phone" role="tab">手机 Demo</button>
      <button type="button" data-mode="web" role="tab">网页 Demo</button>
    </div>
    <div class="actions">
      <button type="button" class="tour" id="btn-tour">一键导览</button>
      <button type="button" class="primary" id="btn-download">下载此 HTML</button>
      <button type="button" id="btn-reset">重置演示数据</button>
    </div>
  </header>
  <p class="hint">
    可完全离线双击打开（不依赖外网字体/API）。
    点右上角 <strong>一键导览</strong>：按产品逻辑自动演示手机捕获 → 用途确认 → 网页领域/用途 → 梳逻辑线，每步旁白说明痛点与特色。
    本包为<strong>前端完整高保真演示</strong>：手机捕获、用途确认、网页筛选/领域可视化、梳逻辑引用均可用。
  </p>

  <div class="tour-dim" id="tour-dim" aria-hidden="true"></div>
  <div class="tour-spot" id="tour-spot" aria-hidden="true"></div>
  <aside class="tour-card" id="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-title">
    <div class="kicker">
      <b id="tour-phase">产品导览</b>
      <span id="tour-step-label">1 / 1</span>
    </div>
    <h3 id="tour-title">标题</h3>
    <p class="pain" id="tour-pain" hidden></p>
    <p class="say" id="tour-say"></p>
    <div class="bar">
      <div class="prog" aria-hidden="true"><i id="tour-prog"></i></div>
      <div class="btns">
        <button type="button" id="tour-prev">上一步</button>
        <button type="button" id="tour-pause">暂停</button>
        <button type="button" class="go" id="tour-next">下一步</button>

        <div class="shell" data-tour="shell">

    <!-- WEB -->
    <section class="panel" id="panel-web">
      <div class="web" data-tour="web-shell">

          <div class="web-nav">
            <button type="button" class="on" data-wview="library">笔记库</button>
            <button type="button" data-wview="think">梳逻辑线</button>
          </div>
          <span style="font-size:12px;color:var(--muted)">网页工作台 · 离线精简版</span>
        </div>
        <div class="web-body on" id="w-library">
          <div class="ask" data-tour="ask">
            <span>问明晰</span>
            <input readonly value="把库里关于 Agent 短期记忆的避雷与正例梳成一条逻辑线…" />
          </div>
          <div class="chips" id="purpose-chips" data-tour="purpose-chips"></div>
          <div class="lib-layout">
            <aside class="rail" id="domain-rail" data-tour="domain-rail"></aside>

              <div class="grid" id="note-grid" data-tour="note-grid"></div>
              <article class="detail" id="note-detail" data-tour="note-detail"></article>
            </div>
          </div>
        </div>
        <div class="web-body" id="w-think">
          <div class="think" data-tour="think-area">
            <div class="chat">
              <div class="chat-log" id="chat-log"></div>
            </div>
            <div class="canvas" id="logic-canvas"></div>
          </div>
          <article class="detail" id="think-note" data-tour="think-note" style="margin:12px 16px 16px"></article>
        </div>
      </div>
    </section>
  </main>
  <p class="foot">明晰 Mingxi · 离线产品 Demo · 保存本文件即可带走</p>

<script>
(() => {
  const PURPOSES = ["学习理论", "资料收藏", "反例避坑", "对标拆解", "素材金句", "待定"];
  const FAN = [
    { id: "concept", label: "学习理论" },
    { id: "resource", label: "资料收藏" },
    { id: "counter", label: "反例避坑" },
    { id: "teardown", label: "对标拆解" },
    { id: "quote", label: "素材金句" },
    { id: "park", label: "待定", muted: true },
  ];

  const WEB_NOTES = [
    {
      id: "n1", title: "滑动窗口：最早的短期记忆做法", purpose: "反例避坑",
      domain: ["工程与技术科学", "人工智能"], summary: "最近 K 轮原文塞进 context，超出则截断。",
      body: `<div class="callout"><b>AI 主旨</b>滑动窗口实现最便宜，也最早暴露「重要约束滑出窗口」。</div>
        <h3>机制</h3><p><mark>把最近 K 轮原文拼进 prompt，超出 token 预算就从最早轮次截断。</mark></p>
        <h3>经验</h3><ul><li>客服常用 K=8～16</li><li>编码 Agent 钉住当前文件+报错再滑动态轮次</li></ul>`,
    },
    {
      id: "n2", title: "递归摘要：用压缩换更长的短期", purpose: "对标拆解",
      domain: ["工程与技术科学", "人工智能"], summary: "溢出前摘要旧轮次写回 memory 槽。",
      body: `<div class="callout"><b>AI 主旨</b>facts / narrative 分槽，比纯截断更能留住约束。</div>
        <p><mark>溢出前对旧轮次摘要写回 memory——递归摘要短期记忆。</mark></p>
        <p>实践上 facts 更高权重、更低频更新。</p>`,
    },
    {
      id: "n3", title: "Skill：可安装的能力包", purpose: "学习理论",
      domain: ["工程与技术科学", "人工智能"], summary: "元数据+结构化说明，把「怎么做」外置成制品。",
      body: `<div class="callout"><b>AI 主旨</b>Skill 描述能力；不自动解决路由与运行时门禁。</div>
        <p><mark>Skill = 可复用、可共享的轻量 Agent 能力扩展格式。</mark></p>`,
    },
    {
      id: "n4", title: "Skill 路由漂移避坑", purpose: "反例避坑",
      domain: ["工程与技术科学", "人工智能"], summary: "边界不清时「可安装」反而更乱。",
      body: `<div class="callout"><b>AI 主旨</b>失败常表现为路由漂移，根因是职责重叠。</div>
        <p><mark>同任务多次走偏 ← 边界未写清 / 职责重叠。</mark></p>`,
    },
    {
      id: "n5", title: "间隔重复：何时再见", purpose: "学习理论",
      domain: ["人文与社会科学", "教育学"], summary: "在遗忘临界复习，关键是日程而非多背。",
      body: `<div class="callout"><b>AI 主旨</b>提取是动作，间隔是日程。</div>
        <p><mark>把复习安排在遗忘临界附近；核心不是多背，而是何时再见到。</mark></p>`,
    },
    {
      id: "n6", title: "显存带宽比算力更重要", purpose: "反例避坑",
      domain: ["工程与技术科学", "人工智能"], summary: "单卡高带宽常优于双卡差互联。",
      body: `<div class="callout"><b>AI 主旨</b>堆卡迷信的反例。</div>
        <p><mark>LLM 推理里显存带宽往往比算力更重要；单卡 A800 优于双卡 PCIe。</mark></p>`,
    },
    {
      id: "n7", title: "BM25 仍是企业级默认", purpose: "资料收藏",
      domain: ["工程与技术科学", "数据科学"], summary: "稀疏检索是混合检索的底盘。",
      body: `<p><mark>BM25 仍是大规模场景默认；硬匹配字段上稠密易漂。</mark></p>`,
    },
    {
      id: "n8", title: "Harness：约束执行现场", purpose: "对标拆解",
      domain: ["工程与技术科学", "人工智能"], summary: "循环、门禁、追踪、回退——不是更长说明书。",
      body: `<p><mark>Harness 回答 Agent 怎么跑；Skill 描述能力；Prompt 注入语境。</mark></p>`,
    },
  ];

  const LS = "mingxi-offline-demo-v1";
  let phoneNotes = [];
  let purposeFilter = "全部";
  let domainViz = "heat";
  let domainFilter = null;
  let pendingPick = "反例避坑";

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(LS) || "{}");
      phoneNotes = Array.isArray(raw.phoneNotes) ? raw.phoneNotes : [];
    } catch { phoneNotes = []; }
  }
  function save() {
    localStorage.setItem(LS, JSON.stringify({ phoneNotes }));
  }

  /* —— mode tabs —— */
  function switchMode(mode) {
    document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
    document.getElementById("panel-phone").classList.toggle("on", mode === "phone");
    document.getElementById("panel-web").classList.toggle("on", mode === "web");
  }
  function switchWebView(view) {
    document.querySelectorAll(".web-nav button").forEach((b) => b.classList.toggle("on", b.dataset.wview === view));
    document.getElementById("w-library").classList.toggle("on", view === "library");
    document.getElementById("w-think").classList.toggle("on", view === "think");
  }

  document.querySelectorAll(".tabs button").forEach((btn) => {
    btn.addEventListener("click", () => switchMode(btn.dataset.mode));
  });

  document.getElementById("btn-download").onclick = () => {
    const blob = new Blob([document.documentElement.outerHTML], { type: "text/html;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "mingxi-product-demo.html";
    a.click();
    URL.revokeObjectURL(a.href);
  };
  document.getElementById("btn-reset").onclick = () => {
    localStorage.removeItem(LS);
    phoneNotes = [];
    purposeFilter = "全部";
    domainFilter = null;
    renderPhone("home");
    renderWeb();
    toast("已重置演示数据");
  };

  /* —— phone —— */
  const view = document.getElementById("phone-view");
  const ball = document.getElementById("float-ball");
  const fan = document.getElementById("purpose-fan");
  let holdTimer = null;
  let holding = false;

  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("on");
    setTimeout(() => el.classList.remove("on"), 1800);
  }
  function flash() {
    const el = document.getElementById("flash");
    el.classList.add("on");
    setTimeout(() => el.classList.remove("on"), 120);
  }

  function suggestDomain(title) {
    if (/Claude|提示词|AI|大模型/i.test(title)) return ["工程与技术科学", "人工智能"];
    if (/设计|玻璃|Pinterest/i.test(title)) return ["创作与媒介", "视觉设计"];
    return ["生活与职业", "知识管理"];
  }

  function capture(purposeLabel, parked) {
    flash();
    const title = "刚刚，Claude Opus 5 系统提示词遭完整泄露";
    const note = {
      id: "p_" + Date.now(),
      title,
      app: "小红书",
      purposeLabel,
      parked,
      domainPath: suggestDomain(title),
      domainStatus: "pending",
      capturedAt: new Date().toISOString(),
    };
    phoneNotes.unshift(note);
    save();
    toast(parked ? "已收下 · 待定" : `已存到 · ${purposeLabel}`);
    fan.classList.remove("open");
    setTimeout(() => {
      note.domainStatus = "ok";
      save();
      if (view.dataset.screen === "library") renderPhone("library");
    }, 900);
  }

  fan.innerHTML = FAN.map(
    (x) => `<button type="button" role="menuitem" class="${x.muted ? "muted" : ""}" data-id="${x.id}">${x.label}</button>`,
  ).join("");
  fan.onclick = (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const item = FAN.find((x) => x.id === btn.dataset.id);
    if (!item) return;
    capture(item.label, item.id === "park");
  };

  ball.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    holding = false;
    holdTimer = setTimeout(() => {
      holding = true;
      ball.classList.add("hold");
      fan.classList.add("open");
    }, 420);
  });
  function endHold(doShort) {
    clearTimeout(holdTimer);
    ball.classList.remove("hold");
    if (!holding && doShort) capture("待定", true);
    holding = false;
  }
  ball.addEventListener("pointerup", () => endHold(true));
  ball.addEventListener("pointerleave", () => endHold(false));
  ball.addEventListener("pointercancel", () => endHold(false));

  function renderPhone(screen) {
    view.dataset.screen = screen;
    ball.style.display = screen === "xhs" ? "block" : "none";
    if (screen !== "xhs") fan.classList.remove("open");

    if (screen === "home") {
      view.innerHTML = `<div class="home">
        <h3>桌面</h3>
        <div class="apps">
          <button class="app wx" type="button"><i>微</i><span>微信</span></button>
          <button class="app xhs" type="button" id="open-xhs"><i>书</i><span>小红书</span></button>
          <button class="app bili" type="button"><i>b</i><span>哔哩哔哩</span></button>
          <button class="app mute" type="button"><i>知</i><span>知乎</span></button>
          <button class="app mute" type="button"><i>支</i><span>支付宝</span></button>
          <button class="app mute" type="button"><i>淘</i><span>淘宝</span></button>
          <button class="app mute" type="button"><i>设</i><span>设置</span></button>
          <button class="app mute" type="button"><i>相</i><span>相机</span></button>
        </div>
      </div>`;
      document.getElementById("open-xhs").onclick = () => renderPhone("xhs");
      return;
    }

    if (screen === "xhs") {
      view.innerHTML = `<div class="xhs-screen">
        <div class="xhs-nav"><button type="button" id="xhs-back">‹</button><span>笔记</span></div>
        <div class="xhs-body">
          <div class="xhs-cover">系统提示词泄露 · 封面</div>
          <h2 class="xhs-title">刚刚，Claude Opus 5 系统提示词遭完整泄露</h2>
          <div class="xhs-meta">AI圈刚刚 · 1.2万赞</div>
          <p class="xhs-para">有人把完整 system prompt 贴出来了。结构上能看到角色、工具协议、安全边界分段……</p>
          <p class="xhs-para"><span class="sel" title="划词可选">「别把密钥和策略塞进 prompt——泄露即事故。」</span> 这句值得存进反例避坑。</p>
          <p class="xhs-para">右侧悬浮球：短按收下待定；长按选用途标签。</p>
        </div>
      </div>`;
      document.getElementById("xhs-back").onclick = () => renderPhone("home");
      return;
    }

    if (screen === "library") {
      const pending = phoneNotes.filter((n) => n.parked || n.purposeLabel === "待定");
      view.innerHTML = `<div class="lib-screen">
        <header>
          <strong>笔记库 · ${phoneNotes.length}</strong>
          <button type="button" id="lib-back" style="border:0;background:transparent;font:inherit;cursor:pointer">‹ 桌面</button>
        </header>
        ${
          pending[0]
            ? `<div class="pending-bar" data-tour="pending-bar" data-id="${pending[0].id}">
                <strong>待定 → 用途候选 · ${pending[0].title.slice(0, 18)}…</strong>
                <div class="picks" id="pend-picks">${PURPOSES.filter((p) => p !== "待定")
                  .map((p) => `<button type="button" data-p="${p}" class="${p === pendingPick ? "on" : ""}">${p}</button>`)
                  .join("")}</div>
                <button type="button" id="pend-ok" style="margin-top:8px;width:100%;border:0;background:#111;color:#fff;border-radius:8px;padding:7px;font-size:12px;cursor:pointer">就是它 · 确认用途</button>
              </div>`
            : ""
        }
        <div class="lib-list">
          ${
            phoneNotes.length
              ? phoneNotes
                  .map(
                    (n) => `<div class="lib-card">
                    <strong>${n.title}</strong>
                    <em>${n.app} · ${new Date(n.capturedAt).toLocaleString("zh-CN")}</em>
                    <div class="tags">
                      <i>${n.purposeLabel}</i>
                      <i>${n.domainStatus === "ok" ? n.domainPath.join(" / ") : "领域识别中…"}</i>
                    </div>
                  </div>`,
                  )
                  .join("")
              : `<div class="lib-card"><em>还没有笔记。去小红书帖短按悬浮球试试。</em></div>`
          }
        </div>
      </div>`;
      document.getElementById("lib-back").onclick = () => renderPhone("home");
      const picks = document.getElementById("pend-picks");
      if (picks) {
        picks.onclick = (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          pendingPick = b.dataset.p;
          picks.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
        };
        document.getElementById("pend-ok").onclick = () => {
          const id = document.querySelector(".pending-bar").dataset.id;
          const n = phoneNotes.find((x) => x.id === id);
          if (!n) return;
          n.purposeLabel = pendingPick;
          n.parked = false;
          save();
          toast(`已确认用途 · ${pendingPick}`);
          renderPhone("library");
        };
      }
    }
  }

  document.getElementById("btn-home").onclick = () => renderPhone("home");
  document.getElementById("btn-xhs").onclick = () => renderPhone("xhs");
  document.getElementById("btn-lib").onclick = () => renderPhone("library");

  /* —— web —— */
  document.querySelectorAll(".web-nav button").forEach((btn) => {
    btn.addEventListener("click", () => switchWebView(btn.dataset.wview));
  });

  function filteredNotes() {
    return WEB_NOTES.filter((n) => {
      if (purposeFilter !== "全部" && n.purpose !== purposeFilter) return false;
      if (domainFilter && n.domain[0] !== domainFilter) return false;
      return true;
    });
  }

  function renderRail(notes) {
    const backbone = {
      工程与技术科学: ["人工智能", "软件工程", "数据科学", "工业与制造"],
      人文与社会科学: ["教育学", "心理学"],
      生活与职业: ["知识管理", "职业发展"],
      创作与媒介: ["视觉设计", "内容创作"],
    };
    const counts = {};
    notes.forEach((n) => {
      const l1 = n.domain[0];
      counts[l1] = (counts[l1] || 0) + 1;
      const l2 = n.domain[1];
      if (l2) counts[l1 + "/" + l2] = (counts[l1 + "/" + l2] || 0) + 1;
    });
    let filled = 0, total = 0;
    Object.entries(backbone).forEach(([l1, kids]) => {
      kids.forEach((l2) => {
        total++;
        if (counts[l1 + "/" + l2]) filled++;
      });
    });
    const max = Math.max(1, ...Object.values(counts));
    const rail = document.getElementById("domain-rail");
    rail.innerHTML = `<h4>知识领域 · ${purposeFilter}</h4>
      <p>覆盖 ${filled}/${total} 个示意二级 · ${notes.length} 篇</p>
      <div class="viz-tog">
        <button type="button" class="${domainViz === "heat" ? "on" : ""}" data-v="heat">热力</button>
        <button type="button" class="${domainViz === "icicle" ? "on" : ""}" data-v="icicle">Icicle</button>
      </div>
      <div id="viz-body"></div>`;
    rail.querySelector(".viz-tog").onclick = (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      domainViz = b.dataset.v;
      renderWeb();
    };
    const body = document.getElementById("viz-body");
    if (domainViz === "heat") {
      body.innerHTML = Object.entries(backbone)
        .map(([l1, kids]) => {
          return `<div class="heat-g">
            <span><button type="button" style="border:0;background:transparent;font:inherit;font-weight:600;cursor:pointer;padding:0" data-d="${l1}">${l1}</button><em>${counts[l1] || 0}</em></span>
            <div class="heat-cells">${kids
              .map((l2) => {
                const c = counts[l1 + "/" + l2] || 0;
                const h = c ? Math.log1p(c) / Math.log1p(max) : 0;
                return `<button type="button" class="${c ? "filled" : ""}" style="--h:${h}" data-d="${l1}" title="${l1}/${l2}">${l2}${c ? `<em>${c}</em>` : ""}</button>`;
              })
              .join("")}</div>
          </div>`;
        })
        .join("");
    } else {
      const l1s = Object.keys(backbone).filter((k) => counts[k]);
      const sum = l1s.reduce((s, k) => s + (counts[k] || 0), 0) || 1;
      let y = 0;
      const colors = ["#3a3530", "#c98974", "#5a6f62", "#6a7a9a"];
      body.innerHTML = `<div class="icicle">${l1s
        .map((l1, i) => {
          const h = ((counts[l1] || 0) / sum) * 100;
          const top = y;
          y += h;
          return `<div style="top:${top}%;height:${Math.max(h, 2)}%;left:0;width:34%;background:${colors[i % colors.length]}" data-d="${l1}">${l1} · ${counts[l1]}</div>`;
        })
        .join("")}</div>`;
    }
    body.onclick = (e) => {
      const b = e.target.closest("[data-d]");
      if (!b) return;
      domainFilter = domainFilter === b.dataset.d ? null : b.dataset.d;
      renderWeb();
    };
  }

  function openDetail(note, elId) {
    const el = document.getElementById(elId);
    el.classList.add("on");
    el.innerHTML = `<div class="crumb">${note.domain.join(" / ")} · ${note.purpose}</div>
      <h2>${note.title}</h2>
      <div class="src">Demo 笔记 · 离线包</div>
      <div class="tags"><em>${note.purpose}</em>${note.domain.map((d) => `<em>${d}</em>`).join("")}</div>
      <div class="body">${note.body}</div>
      <button type="button" style="margin-top:10px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer" id="close-${elId}">收起</button>`;
    document.getElementById(`close-${elId}`).onclick = () => el.classList.remove("on");
  }

  function renderWeb() {
    const chips = document.getElementById("purpose-chips");
    chips.innerHTML = ["全部", ...new Set(WEB_NOTES.map((n) => n.purpose))]
      .map((p) => `<button type="button" class="${p === purposeFilter ? "on" : ""}" data-p="${p}">${p}</button>`)
      .join("");
    chips.onclick = (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      purposeFilter = b.dataset.p;
      domainFilter = null;
      renderWeb();
    };
    const notes = filteredNotes();
    renderRail(notes);
    const grid = document.getElementById("note-grid");
    grid.innerHTML = notes
      .map(
        (n) => `<button type="button" class="card" data-id="${n.id}">
          <div class="cat">${n.purpose}</div>
          <strong>${n.title}</strong>
          <p>${n.summary}</p>
        </button>`,
      )
      .join("") || `<p style="color:var(--muted);font-size:0.85rem">当前筛选下没有笔记</p>`;
    grid.onclick = (e) => {
      const b = e.target.closest(".card");
      if (!b) return;
      const note = WEB_NOTES.find((x) => x.id === b.dataset.id);
      if (note) openDetail(note, "note-detail");
    };
  }

  function renderThink() {
    const log = document.getElementById("chat-log");
    log.innerHTML = `
      <div class="bubble user">短期记忆有哪些解决方案？个人助手该怎么叠？</div>

        1. <button type="button" class="cite" data-id="n1">滑动窗口</button> 钉住硬约束<br/>
        2. <button type="button" class="cite" data-id="n2">递归摘要</button> facts/narrative 分槽<br/>
        3. 需要跨会话再上分层记忆<br/>
        4. 出了工具乱调再查 <button type="button" class="cite" data-id="n8">Harness</button><br/><br/>
        点引用角标 → 下方展开完整笔记（黄标为命中片段）。
      </div>`;
    const canvas = document.getElementById("logic-canvas");
    canvas.innerHTML = `
      <div class="node q" style="left:24px;top:40px"><b>短期记忆怎么做？</b><em>问题</em></div>
      <div class="node note" style="left:200px;top:30px" data-id="n1"><b>滑动窗口</b><em>笔记</em></div>
      <div class="node note" style="left:200px;top:110px" data-id="n2"><b>递归摘要</b><em>笔记</em></div>
      <div class="node note" style="left:200px;top:190px" data-id="n8"><b>Harness</b><em>笔记</em></div>
      <div class="node" style="left:380px;top:100px"><b>个人助手最小组合</b><em>结论</em></div>`;
    function bindCite(root) {
      root.querySelectorAll("[data-id]").forEach((el) => {
        el.addEventListener("click", () => {
          const note = WEB_NOTES.find((x) => x.id === el.dataset.id);
          if (note) openDetail(note, "think-note");
        });
      });
    }
    bindCite(log);
    bindCite(canvas);
  }

  load();
  renderPhone("home");
  renderWeb();
  renderThink();

  /* ========== 一键导览：产品故事线 ========== */

    timer: null,

    running: false,
    reduceMotion: window.matchMedia("(prefers-reduced-motion: reduce)").matches,
  };

  const STEPS = [

      },
    },
    {
      phase: "网页 · 梳逻辑",

      say: "梳逻辑线：对话推进问题，右侧画布长出节点。引用角标挂回仓库笔记——结论可追溯，不是空口建议。",
      target: "[data-tour=think-area]",

      wait: 5500,
      enter() {
        switchWebView("think");
        renderThink();

      },
    },
    {
      phase: "网页 · 引用",
      title: "点引用 → 证据从你的库里展开",
      say: "点击「滑动窗口」引用：下方展开完整笔记与命中片段。特色是人机共读同一份笔记——Agent 建议绑在你亲手收下的材料上。",
      target: "[data-tour=think-note]",

      wait: 5200,
      enter() {
        switchWebView("think");
        openDetail(WEB_NOTES[0], "think-note");
        const cite = document.querySelector('#chat-log .cite[data-id="n1"]');
        cite?.classList.add("on", "tour-pulse");
      },
      leave() {
        document.querySelectorAll("#chat-log .cite").forEach((c) => c.classList.remove("on", "tour-pulse"));

    },
    {

      target: ".brand",
      mode: "web",
      wait: 6000,
      enter() {
        switchMode("web");

  ];

  const dim = document.getElementById("tour-dim");
  const spot = document.getElementById("tour-spot");
  const card = document.getElementById("tour-card");
  const btnTour = document.getElementById("btn-tour");

  function clearTourTimer() {
    if (tour.timer) {
      clearTimeout(tour.timer);
      tour.timer = null;
    }
  }

  function placeCard(rect) {
    const pad = 14;
    const cw = card.offsetWidth || 360;
    const ch = card.offsetHeight || 220;
    let left = rect.right + 16;
    let top = rect.top;
    if (left + cw > window.innerWidth - pad) left = rect.left - cw - 16;
    if (left < pad) left = pad;
    if (top + ch > window.innerHeight - pad) top = window.innerHeight - ch - pad;
    if (top < pad) top = pad;
    card.style.left = `${left}px`;
    card.style.top = `${top}px`;
  }

  function highlight(sel) {
    const el = typeof sel === "string" ? document.querySelector(sel) : sel;
    if (!el) {
      spot.classList.remove("on");
      card.style.left = "50%";
      card.style.top = "18%";
      card.style.transform = "translateX(-50%)";
      return null;
    }
    card.style.transform = "";
    const r = el.getBoundingClientRect();
    const m = 8;
    spot.style.top = `${Math.max(0, r.top - m)}px`;
    spot.style.left = `${Math.max(0, r.left - m)}px`;
    spot.style.width = `${r.width + m * 2}px`;
    spot.style.height = `${r.height + m * 2}px`;
    spot.classList.add("on");
    placeCard({
      top: r.top,
      left: r.left,
      right: r.right,
      bottom: r.bottom,
    });
    return el;
  }

  function showStep(i) {
    const prev = STEPS[tour.i];
    if (prev?.leave) {
      try {
        prev.leave();
      } catch (_) {}
    }
    tour.i = i;
    const step = STEPS[i];
    if (step.mode) switchMode(step.mode);
    if (step.enter) {
      try {
        step.enter();
      } catch (_) {}
    }
    document.getElementById("tour-phase").textContent = step.phase;
    document.getElementById("tour-title").textContent = step.title;
    document.getElementById("tour-say").textContent = step.say;
    document.getElementById("tour-step-label").textContent = `${i + 1} / ${STEPS.length}`;
    document.getElementById("tour-prog").style.width = `${((i + 1) / STEPS.length) * 100}%`;
    const pain = document.getElementById("tour-pain");
    if (step.pain) {
      pain.hidden = false;
      pain.innerHTML = step.pain.replace(/^痛点：/, "<strong>痛点</strong> · ");
    } else {
      pain.hidden = true;
      pain.textContent = "";
    }
    document.getElementById("tour-prev").disabled = i === 0;
    document.getElementById("tour-next").textContent = i === STEPS.length - 1 ? "完成" : "下一步";
    requestAnimationFrame(() => {
      highlight(step.target);
      // re-measure after layout
      setTimeout(() => highlight(step.target), 80);
    });
  }

  function scheduleNext() {
    clearTourTimer();
    if (tour.paused || !tour.running) return;
    if (tour.reduceMotion) return;
    const step = STEPS[tour.i];
    const wait = step.wait || 4500;
    tour.timer = setTimeout(() => {
      if (tour.i >= STEPS.length - 1) stopTour(true);
      else goTour(tour.i + 1);
    }, wait);
  }

  function goTour(i) {
    showStep(i);
    scheduleNext();
  }

  function startTour() {
    tour.running = true;
    tour.paused = false;
    document.getElementById("tour-pause").textContent = "暂停";
    dim.classList.add("on");
    card.classList.add("on");
    btnTour.disabled = true;
    btnTour.textContent = "导览中…";
    goTour(0);
  }

  function stopTour(done) {
    clearTourTimer();
    const cur = STEPS[tour.i];
    if (cur?.leave) {
      try {
        cur.leave();
      } catch (_) {}
    }
    tour.running = false;
    tour.paused = false;
    dim.classList.remove("on");
    spot.classList.remove("on");
    card.classList.remove("on");
    btnTour.disabled = false;
    btnTour.textContent = done ? "再看一遍导览" : "一键导览";
    ball.classList.remove("tour-pulse", "hold");
    fan.classList.remove("open");
  }

  document.getElementById("btn-tour").onclick = () => {
    if (tour.running) return;
    startTour();
  };
  document.getElementById("tour-skip").onclick = () => stopTour(false);
  document.getElementById("tour-prev").onclick = () => {
    if (tour.i <= 0) return;
    goTour(tour.i - 1);
  };
  document.getElementById("tour-next").onclick = () => {
    if (tour.i >= STEPS.length - 1) stopTour(true);
    else goTour(tour.i + 1);
  };
  document.getElementById("tour-pause").onclick = () => {
    if (!tour.running) return;
    tour.paused = !tour.paused;
    document.getElementById("tour-pause").textContent = tour.paused ? "继续" : "暂停";
    if (tour.paused) clearTourTimer();
    else scheduleNext();
  };
  window.addEventListener("resize", () => {
    if (tour.running) highlight(STEPS[tour.i]?.target);
  });
  document.addEventListener("keydown", (e) => {
    if (!tour.running) return;
    if (e.key === "Escape") stopTour(false);
    if (e.key === "ArrowRight") document.getElementById("tour-next").click();
    if (e.key === "ArrowLeft") document.getElementById("tour-prev").click();
  });
})();
</script>
