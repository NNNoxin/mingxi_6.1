# 本地开发依赖。版本与线上对齐：PostgreSQL 16 + pgvector 0.8（Neon），Valkey 8（Render Key Value）。
# 用法：docker compose -f infra/docker-compose.yml up -d
# 对象存储（MinIO）与开发邮件（Mailpit）在用到它们的阶段（P4 / P3）加入。
name: mingxi

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: mingxi
      POSTGRES_PASSWORD: mingxi_local_only
      POSTGRES_DB: mingxi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mingxi -d mingxi"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
